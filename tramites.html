<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Trámites de Posgrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0B3D24;
    --navy-deep:#052616;
    --paper:#F6F7F3;
    --paper-card:#FFFFFF;
    --gold:#C41E24;
    --gold-light:#A6CE39;
    --ink:#1C231E;
    --ink-soft:#5B6459;
    --line:#DEE3D9;
    --ok-bg:#E7F0E5; --ok-fg:#1C7A3E;
    --pend-bg:#FCE9EA; --pend-fg:#B0272C;
    --closed-bg:#EAEAE6; --closed-fg:#6B675D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 64px;}

  /* Header */
  header{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#F3EFE4;
    padding:36px 22px 28px;
    border-bottom:4px solid var(--gold);
  }
  .logos{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .logos img{
    height:52px;
    width:auto;
    display:block;
    background:#fff;
    border-radius:8px;
    padding:4px;
  }
  .logos .divider{
    width:1px;
    height:36px;
    background:rgba(255,255,255,0.25);
  }
  header h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:26px;
    line-height:1.25;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    color:#C9CEDA;
    font-size:14.5px;
    line-height:1.5;
    max-width:46ch;
  }

  /* Process list */
  .procesos{padding:22px 22px 0;}
  .proceso{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .proceso-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .proceso-head .idx{
    font-family:'Source Serif 4', serif;
    font-size:20px;
    color:var(--gold);
    font-weight:600;
    width:26px;
    flex-shrink:0;
  }
  .proceso-head .titulo{
    flex:1;
    min-width:0;
  }
  .proceso-head .titulo h2{
    font-family:'Source Serif 4', serif;
    font-size:16.5px;
    font-weight:600;
    margin:0 0 3px;
    line-height:1.3;
  }
  .proceso-head .titulo .sub{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .chev{
    width:18px;height:18px;flex-shrink:0;
    transition:transform .2s ease;
    color:var(--ink-soft);
  }
  .proceso.open .chev{transform:rotate(180deg);}

  .proceso-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    border-top:1px solid var(--line);
  }
  .proceso.open .proceso-body{border-top:1px solid var(--line);}

  .fase{padding:16px 16px 4px;}

  /* Caja de instrucciones de acceso al portal */
  .info-tramite{
    margin:0 16px 16px;
    padding:14px 16px;
    background:#F1F6F2;
    border:1px solid #CFE0D5;
    border-radius:10px;
  }
  .info-tramite .info-titulo{
    font-size:12.5px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
  }
  .info-tramite ul{
    margin:0;
    padding-left:18px;
  }
  .info-tramite li{
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    margin-bottom:2px;
  }
  .info-tramite a{
    display:inline-block;
    margin-top:10px;
    font-size:13px;
    font-weight:600;
    color:var(--gold);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
  }
  .fase:last-child{padding-bottom:16px;}
  .fase-titulo{
    font-size:11.5px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:8px;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .fase .item:last-child{border-bottom:none;}
  .item .nombre{color:var(--ink);line-height:1.35;}
  .item .nombre::before{
    content:"";
    display:inline-block;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--gold-light);
    margin-right:9px;
    vertical-align:middle;
  }
  .tag-formato{
    flex-shrink:0;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.01em;
    padding:3px 8px;
    border-radius:20px;
    border:1px solid #CFE0D5;
    color:#3E6E52;
    background:#F1F6F2;
    white-space:nowrap;
  }

  /* PDF button */
  .pdf-btn-wrap{
    padding:18px 22px 0;
  }
  .pdf-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--navy);
    color:#F3EFE4;
    border:none;
    border-radius:10px;
    padding:14px 18px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .pdf-btn:hover{background:var(--navy-deep);}
  .pdf-btn svg{width:17px;height:17px;flex-shrink:0;}

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:26px 22px 0;
  }
</style>
</head>

function render(){
  const procesosEl = document.getElementById('procesos');

  DATA.forEach((proc, pi) => {
    const div = document.createElement('div');
    div.className = 'proceso' + (pi===0 ? ' open' : '');

    let infoHtml = '';
    if (proc.info) {
      infoHtml = `<div class="info-tramite">
        <div class="info-titulo">${proc.info.titulo}</div>
        <ul>
          ${proc.info.pasos.map(p => `<li>${p}</li>`).join('')}
        </ul>
        ${proc.info.enlaceManual ? `<a href="${proc.info.enlaceManual}" target="_blank" rel="noopener">${proc.info.enlaceLabel || 'Ver enlace'}</a>` : ''}
      </div>`;
    }

    let fasesHtml = '';
    proc.fases.forEach(fase => {
      fasesHtml += `<div class="fase">
        <div class="fase-titulo">${fase.nombre}</div>
        ${fase.items.map(([nombre, requiereFormato]) => `
          <div class="item">
            <span class="nombre">${nombre}</span>
            ${requiereFormato ? '<span class="tag-formato">Requiere formato</span>' : ''}
          </div>
        `).join('')}
      </div>`;
    });

    div.innerHTML = `
      <div class="proceso-head" role="button" tabindex="0">
        <span class="idx">${pi+1}</span>
        <div class="titulo">
          <h2>${proc.titulo}</h2>
        </div>
        <svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="proceso-body">${infoHtml}${fasesHtml}</div>
    `;

    const head = div.querySelector('.proceso-head');
    const body = div.querySelector('.proceso-body');
    function setHeight(open){
      body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
    }
    head.addEventListener('click', () => {
      const willOpen = !div.classList.contains('open');
      div.classList.toggle('open', willOpen);
      setHeight(willOpen);
    });
    head.addEventListener('keydown', (e) => {
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); head.click(); }
    });

    procesosEl.appendChild(div);
    if(pi===0){ requestAnimationFrame(()=> setHeight(true)); }
  });
}
render();

// Descarga directa en PDF (sin diálogo de impresión)
document.getElementById('pdfBtn').addEventListener('click', () => {
  const btn = document.getElementById('pdfBtn');
  const label = document.getElementById('pdfBtnLabel');
  const wrap = document.querySelector('.wrap');
  const btnWrap = document.querySelector('.pdf-btn-wrap');

  label.textContent = 'Generando PDF…';
  btn.disabled = true;

  // Expandir todas las fases para que salgan completas en el PDF
  const procesos = document.querySelectorAll('.proceso');
  const previousStates = [];
  procesos.forEach(p => {
    previousStates.push(p.classList.contains('open'));
    p.classList.add('open');
    const body = p.querySelector('.proceso-body');
    body.style.maxHeight = 'none';
  });
  btnWrap.style.display = 'none';

  const restore = () => {
    label.textContent = 'Descargar en PDF';
    btn.disabled = false;
    btnWrap.style.display = '';
    procesos.forEach((p, i) => {
      p.classList.toggle('open', previousStates[i]);
      const body = p.querySelector('.proceso-body');
      body.style.maxHeight = previousStates[i] ? body.scrollHeight + 'px' : '0px';
    });
  };

  // Pequeña espera para que el navegador termine de reacomodar el layout
  setTimeout(() => {
    const widthPx = wrap.scrollWidth;
    const heightPx = wrap.scrollHeight;

    // Limitar el tamaño del canvas para que no falle en navegadores móviles
    const maxDim = 4000;
    const maxArea = 16000000;
    let scale = Math.min(
      2,
      maxDim / heightPx,
      maxDim / widthPx,
      Math.sqrt(maxArea / (widthPx * heightPx))
    );
    if (scale < 0.3) scale = 0.3;

    html2canvas(wrap, {
      scale: scale,
      useCORS: true,
      scrollX: 0,
      scrollY: -window.scrollY,
      windowWidth: widthPx,
      windowHeight: heightPx,
    }).then(canvas => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        unit: 'px',
        format: [canvas.width, canvas.height],
        hotfixes: ['px_scaling'],
      });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
      pdf.save('tramites-posgrado.pdf');
      restore();
    }).catch(err => {
      console.error('Error generando PDF:', err);
      label.textContent = 'Error, intenta de nuevo';
      btn.disabled = false;
      btnWrap.style.display = '';
      setTimeout(restore, 1500);
    });
  }, 150);
});
